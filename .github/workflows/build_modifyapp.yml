name: build_modifyapp

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: '1.0.0'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build deb
        run: |
          export THEOS="$(pwd)/theos"
          cd ModifyApp
          gmake -j$(sysctl -n hw.physicalcpu) package
          ls -la packages/*.deb

      - name: Build ipa
        run: |
          export THEOS="$(pwd)/theos"
          cd ModifyApp
          gmake -j$(sysctl -n hw.physicalcpu) package FINALPACKAGE=1 PACKAGE_FORMAT=ipa
          ls -la packages/*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: ModifyApp
          path: |
            ModifyApp/packages/*.deb
            ModifyApp/packages/*.ipa

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: ModifyApp_${{ env.VERSION }}
          tag_name: ModifyApp_${{ env.VERSION }}
          prerelease: false
          token: ${{ github.token }}
          files: |
            ModifyApp/packages/*.deb
            ModifyApp/packages/*.ipa
